<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Month Selection Card -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-sm p-6 w-full max-w-[340px] flex flex-col gap-6">
<!-- Header -->
<div class="flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h2 class="font-headline-md text-headline-md text-center flex-1">2024</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Month Grid -->
<div class="grid grid-cols-3 gap-y-6 gap-x-4 place-items-center">
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Jan</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Feb</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Mar</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Apr</button>
<!-- Active Month -->
<button class="w-16 h-12 flex items-center justify-center rounded-full bg-primary text-on-primary font-body-lg text-body-lg font-bold shadow-md">May</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Jun</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Jul</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Aug</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Sep</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Oct</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Nov</button>
<button class="w-16 h-12 flex items-center justify-center rounded-xl font-body-lg text-body-lg text-on-surface hover:bg-surface-variant transition-colors">Dec</button>
</div>

<div class="flex justify-end pt-2 border-t border-surface-variant">
<button class="px-6 py-3 rounded-full font-label-md text-label-md text-primary hover:bg-primary-container/50 transition-colors">Done</button>
