<body class="antialiased min-h-screen flex flex-col relative pb-safe">
<!-- TopAppBar Container -->
<header class="bg-background/80 backdrop-blur-md fixed top-0 w-full flex items-center justify-between px-container-padding h-16 z-50 flat no shadows">
<!-- Leading Icon: Back Arrow -->
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0; font-size: 24px;">arrow_back</span>
</button>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-primary tracking-tight font-extrabold flex-1 text-center">New Note</h1>
<!-- Trailing Space (Empty for balance) -->
<div class="w-12 h-12"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pt-[80px] px-container-padding pb-[100px] max-w-2xl mx-auto w-full gap-unit-6">
<!-- Note Input Area -->
<div class="flex-1 flex flex-col bg-surface-container-low rounded-2xl p-4 shadow-sm border border-surface-dim/50 focus-within:ring-2 focus-within:ring-secondary-fixed/50 transition-all duration-300">
<input class="bg-transparent border-none focus:ring-0 font-title-lg text-title-lg text-on-surface placeholder-on-surface-variant mb-2 w-full" placeholder="Title..." type="text">
<textarea class="bg-transparent border-none focus:ring-0 flex-1 resize-none font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/70 w-full outline-none" placeholder="Jot down your thoughts or reminders here..."></textarea>
</div>
<!-- Categorization Tags -->
<div class="flex flex-col gap-unit-2">
<h2 class="font-label-md text-label-md text-on-surface-variant px-1">Tags</h2>
<div class="flex overflow-x-auto gap-unit-2 hide-scrollbar pb-1 pt-1 -mx-container-padding px-container-padding snap-x">
<!-- Tag 1 (Active/Primary) -->
<button class="shrink-0 bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-2 rounded-full active:scale-95 transition-transform shadow-sm snap-start">
                    School
                </button>
<!-- Tag 2 (Secondary) -->
<button class="shrink-0 bg-secondary-container text-on-secondary-container font-label-md text-label-md px-4 py-2 rounded-full active:scale-95 transition-transform border border-transparent shadow-sm snap-start">
                    Parents
                </button>
<!-- Tag 3 (Secondary) -->
<button class="shrink-0 bg-surface-container-high text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full active:scale-95 transition-transform border border-transparent hover:bg-secondary-container/50 shadow-sm snap-start">
                    Ideas
                </button>
<!-- Tag 4 (Secondary) -->
<button class="shrink-0 bg-surface-container-high text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full active:scale-95 transition-transform border border-transparent hover:bg-secondary-container/50 shadow-sm snap-start">
                    Lesson Plan
                </button>
<!-- Tag 5 (Add New) -->
<button class="shrink-0 bg-transparent text-secondary font-label-md text-label-md px-3 py-2 rounded-full border border-dashed border-outline-variant active:scale-95 transition-transform flex items-center gap-1 snap-start">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span> New
                </button>
</div>
</div>
</main>
<!-- Bottom Action Area (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-md pt-4 pb-8 px-container-padding border-t border-surface-container-low z-40 shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.05)]">
<div class="max-w-2xl mx-auto w-full">
<button class="w-full bg-primary-container hover:bg-primary-fixed active:bg-primary-fixed-dim text-on-primary-container font-title-lg text-title-lg py-4 px-6 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2">
