<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Year Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#1b1d0e",
                        "surface-bright": "#fff8f7",
                        "primary-fixed-dim": "#e9bacd",
                        "on-tertiary-fixed-variant": "#474836",
                        "inverse-primary": "#e9bacd",
                        "surface-container-highest": "#ebe0e0",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#d7d7bf",
                        "tertiary": "#5e604d",
                        "on-surface": "#201a1a",
                        "secondary-container": "#cce6f9",
                        "tertiary-fixed": "#e4e4cc",
                        "inverse-on-surface": "#faeeee",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#f1e5e5",
                        "on-tertiary-container": "#5c5d4a",
                        "on-primary-container": "#765162",
                        "tertiary-fixed-dim": "#c8c8b0",
                        "secondary-fixed": "#cce6f9",
                        "outline": "#817478",
                        "secondary-fixed-dim": "#b0cadc",
                        "on-secondary-fixed-variant": "#314a59",
                        "surface-container-low": "#fdf1f1",
                        "surface-container": "#f7ebeb",
                        "primary-container": "#f8c8dc",
                        "on-surface-variant": "#4f4448",
                        "surface-dim": "#e3d7d7",
                        "background": "#fff8f7",
                        "surface": "#fff8f7",
                        "error-container": "#ffdad6",
                        "primary": "#795465",
                        "secondary": "#496271",
                        "on-background": "#201a1a",
                        "primary-fixed": "#ffd8e7",
                        "on-primary-fixed-variant": "#5f3c4d",
                        "on-primary-fixed": "#2e1221",
                        "on-secondary-fixed": "#021e2b",
                        "surface-variant": "#ebe0e0",
                        "outline-variant": "#d2c3c7",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#4f6877",
                        "surface-tint": "#795465",
                        "inverse-surface": "#352f2f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit-6": "24px",
                        "container-padding": "20px",
                        "unit-8": "32px",
                        "unit-2": "8px",
                        "unit-4": "16px",
                        "unit-1": "4px",
                        "base": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Quicksand"],
                        "body-sm": ["Quicksand"],
                        "label-md": ["Quicksand"],
                        "display-lg-mobile": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "title-lg": ["Quicksand"],
                        "display-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Year Selection Card -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-sm w-[320px] p-unit-6 flex flex-col items-center">
<!-- Header -->
<h2 class="font-title-lg text-title-lg text-on-surface mb-unit-4">Select Year</h2>
<!-- Scrollable Year Grid -->
<div class="w-full h-[200px] overflow-y-auto no-scrollbar grid grid-cols-3 gap-y-unit-4 gap-x-unit-2 py-unit-2 relative">
<!-- Fade overlays for soft scrolling effect -->
<div class="absolute top-0 left-0 w-full h-8 bg-gradient-to-b from-surface-container-lowest to-transparent pointer-events-none z-10"></div>
<div class="absolute bottom-0 left-0 w-full h-8 bg-gradient-to-t from-surface-container-lowest to-transparent pointer-events-none z-10"></div>
<!-- Years List -->
<!-- Previous Years -->
<button class="font-body-lg text-body-lg text-on-surface-variant py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2020</button>
<button class="font-body-lg text-body-lg text-on-surface-variant py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2021</button>
<button class="font-body-lg text-body-lg text-on-surface-variant py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2022</button>
<!-- Active Year -->
<button class="font-body-lg text-body-lg text-on-primary bg-primary py-2 rounded-full shadow-sm flex items-center justify-center">2023</button>
<!-- Future Years -->
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2024</button>
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2025</button>
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2026</button>
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2027</button>
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2028</button>
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2029</button>
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2030</button>
<button class="font-body-lg text-body-lg text-on-surface py-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">2031</button>
</div>
<!-- Footer Action -->
<div class="mt-unit-6 w-full flex justify-end">
<button class="font-label-md text-label-md text-primary hover:text-primary/80 transition-colors px-4 py-2 uppercase tracking-widest">
                Done
            </button>
</div>
</div>
</body></html>
