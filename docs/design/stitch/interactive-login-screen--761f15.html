<!DOCTYPE html><html lang="en"><head>

                    "tertiary-fixed": "#e4e4cc",

                    "on-surface-variant": "#4f4448",

            "borderRadius": {

                    "lg": "0.5rem",
                    "xl": "0.75rem",

            "spacing": {

                    "container-padding": "20px",

                    "body-lg": [

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Custom styles to match the exact aesthetic */
        .glass-input {
            background-color: rgba(255, 248, 247, 0.6); /* Very soft beige transparency */
            backdrop-filter: blur(8px);
        }
        
        .login-card {
            background-color: #e5d9c5; /* Matching the visual beige card color */
            border-top-left-radius: theme('borderRadius.2xl');
            border-top-right-radius: theme('borderRadius.2xl');
            flex-grow: 1;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.02);
        }
        
        .logo-circle {
            background-color: #f5ebe6; /* Soft beige for the logo circle */
        }
        
        .btn-primary {
            background-color: #f7cce0; /* Soft pink matching the image */
            color: theme('colors.on-surface');
            box-shadow: 0 4px 14px rgba(247, 204, 224, 0.4);
            transition: all 0.2s ease;
        }
        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(247, 204, 224, 0.4);
        }
        
        .input-icon {
            color: #9ea0a5;
        }
    </style>
</head>
<body class="antialiased">
<!-- Main Content Canvas -->
<main class="flex flex-col flex-1 items-center justify-start pt-12 px-container-padding max-w-md mx-auto w-full relative z-10">
<!-- Header Section -->
<div class="flex flex-col items-center text-center w-full animate-[fadeIn_0.5s_ease-out] mb-6">
<!-- Brand Logo -->
<div class="w-24 h-24 rounded-full logo-circle flex items-center justify-center mb-6">
<!-- A soft, stylized heart/document icon to match the gentle productivity vibe -->
<div class="relative w-12 h-12 flex justify-center items-center">
<span class="material-symbols-outlined text-[48px] text-[#f7cce0]" style="font-variation-settings: 'FILL' 1;">
                        favorite
                    </span>
<span class="material-symbols-outlined text-[20px] text-[#a3dff2] absolute z-10 bg-white/50 rounded-sm px-0.5" style="font-variation-settings: 'FILL' 1;">
                        receipt_long
                    </span>
</div>
</div>
<!-- Greetings -->
<h1 class="font-display-md text-display-md text-on-background mb-3">
                Welcome back,<br>Teacher
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Take a deep breath. Let's plan your day.
            </p>
</div>
</main>
<!-- Login Card (Bottom Section) -->
<div class="login-card w-full max-w-md mx-auto px-container-padding py-8 flex flex-col gap-unit-6 relative z-20 animate-[slideUp_0.4s_ease-out]">
<form action="#" class="flex flex-col gap-4 items-center" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative group w-full">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined input-icon transition-colors group-focus-within:text-primary">
                        mail
                    </span>
</div>
<input class="block w-full pl-12 pr-4 py-4 rounded-xl border-none ring-0 glass-input focus:ring-2 focus:ring-secondary-fixed focus:outline-none transition-all font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="email" placeholder="Email Address" required="" type="email">
</div>
<!-- Password Input -->
<div class="relative group w-full">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined input-icon transition-colors group-focus-within:text-primary">
                        lock
                    </span>
</div>
<input class="block w-full pl-12 pr-4 py-4 rounded-xl border-none ring-0 glass-input focus:ring-2 focus:ring-secondary-fixed focus:outline-none transition-all font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="password" placeholder="Password" required="" type="password">
</div>
<!-- Forgot Password Link -->
<div class="flex justify-center mt-2 mb-2">
<a class="font-body-sm text-body-sm text-on-surface-variant underline decoration-outline-variant hover:text-primary hover:decoration-primary transition-colors" href="#">
                    Forgot Password?
                </a>
</div>
<!-- Sign In Button -->
<button class="w-full py-4 btn-primary font-title-lg text-title-lg mt-2 flex justify-center items-center rounded-2xl" type="submit">
                Sign In
            </button>
</form>
</div>
<!-- Background Atmospheric Shapes (Optional, adds soft depth) -->
<div class="fixed top-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed/20 blur-3xl -z-10 pointer-events-none"></div>
<div class="fixed bottom-[20%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-fixed/20 blur-3xl -z-10 pointer-events-none"></div>
<style>
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
<script>
        // Simple script to handle input focus states if needed for specific animations
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]', 'transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
            });
        });
    </script>


</body></html>
