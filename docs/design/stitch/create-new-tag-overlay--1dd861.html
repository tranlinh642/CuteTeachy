<body class="bg-surface-variant font-body-lg text-body-lg text-on-surface antialiased h-screen flex items-center justify-center">
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 bg-inverse-surface/20 backdrop-blur-sm flex items-center justify-center p-4 z-50">
<!-- Modal Container -->
<div class="bg-surface-container-lowest rounded-2xl w-full max-w-sm shadow-md overflow-hidden transform transition-all">
<!-- Header -->
<div class="flex items-center justify-between p-unit-6 border-b border-surface-container-highest/50">
<h2 class="font-title-lg text-title-lg text-on-surface">Create New Tag</h2>
<button class="text-on-surface-variant hover:bg-surface-container-high rounded-full p-2 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Content Body -->
<div class="p-unit-6 space-y-unit-6">
<!-- Input Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit-2" for="tag-name">Tag Name</label>
<input class="w-full bg-surface-container rounded-lg border-none px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-secondary-container transition-shadow" id="tag-name" placeholder="e.g., Exam Prep..." type="text">
</div>
<!-- Color Selection -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit-4">Select Color</label>
<div class="flex items-center gap-4">
<!-- Swatch 1: Selected (Light Pink / Primary Container) -->
<button class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center ring-2 ring-primary ring-offset-2 ring-offset-surface-container-lowest transition-all">
</button>
<!-- Swatch 2: Baby Blue (Secondary Container) -->
<button class="w-10 h-10 rounded-full bg-secondary-container hover:scale-110 transition-transform">
</button>
<!-- Swatch 3: Warm Beige (Tertiary Container) -->
<button class="w-10 h-10 rounded-full bg-tertiary-container hover:scale-110 transition-transform">
</button>
<!-- Swatch 4: Soft Lavender (Custom representation using an inverse-primary variant for this example) -->
<button class="w-10 h-10 rounded-full bg-inverse-primary hover:scale-110 transition-transform">
</button>
<!-- Swatch 5: Mint Green (Custom representation using a tertiary variant for this example) -->
<button class="w-10 h-10 rounded-full bg-tertiary-fixed hover:scale-110 transition-transform">
</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-unit-6 pt-0 flex items-center justify-end gap-4">
<button class="px-unit-6 py-3 font-headline-md text-body-lg text-on-surface-variant hover:bg-surface-container-highest rounded-2xl transition-colors">
                    Cancel
                </button>
<button class="px-unit-6 py-3 font-headline-md text-body-lg bg-primary-container text-on-primary-container rounded-2xl hover:bg-primary-fixed hover:shadow-md transition-all active:scale-95">
                    Create
                </button>
</div>
</div>
</div>
</body></html>
